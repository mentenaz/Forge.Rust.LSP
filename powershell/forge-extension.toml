id = "powershell"
name = "PowerShell"
description = "PowerShell language support for Forge: wraps PowerShellEditorServices, downloaded automatically on first use."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "powershell"
file_extensions = ["ps1", "psm1", "psd1"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-powershell"
args = []
