id = "cpp"
name = "C/C++"
description = "C and C++ language support for Forge: clangd, preferring an install already on PATH, otherwise downloading a pinned clangd release automatically."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "cpp"
file_extensions = ["c", "cc", "cpp", "cxx", "h", "hh", "hpp", "hxx"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-cpp"
args = []
# Upstream clangd releases are x86_64-only; keep the registry truthful.
platforms = ["windows-x86_64", "macos-x86_64", "macos-aarch64", "linux-x86_64"]
