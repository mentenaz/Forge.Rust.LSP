[workspace]
resolver = "2"
members = [
    "Json",
    "CSharp",
    "powershell",
    "Rust",
    "Python",
    "Cpp",
    "Lua",
    "Toml",
    "Markdown",
    "Zig",
    "TypeScript",
    "Terraform",
    "Sql",
    "Bash",
    "Yaml",
    "Html",
    "Css",
    "Go",
    "Dart",
    "common",
    "tools/registry-gen",
]

[workspace.package]
edition = "2021"

[profile.release]
lto = true
strip = true