id = "toml"
name = "TOML"
description = "TOML language support for Forge: taplo, preferring an install already on PATH, otherwise downloading a pinned release automatically."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "toml"
file_extensions = ["toml"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-toml"
args = []
