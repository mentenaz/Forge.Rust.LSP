id = "rust"
name = "Rust"
description = "Rust language support for Forge: rust-analyzer, preferring the toolchain-matched install already on PATH, otherwise downloading a pinned release automatically."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "rust"
file_extensions = ["rs"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-rust"
args = []
