id = "lua"
name = "Lua"
description = "Lua language support for Forge: the sumneko lua-language-server, preferring an install already on PATH, otherwise downloading a pinned release automatically."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "lua"
file_extensions = ["lua"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-lua"
args = []
# Upstream ships no windows-aarch64 build; keep the registry truthful.
platforms = ["windows-x86_64", "macos-x86_64", "macos-aarch64", "linux-x86_64", "linux-aarch64"]
