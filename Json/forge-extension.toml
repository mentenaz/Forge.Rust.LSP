id = "json"
name = "JSON"
description = "JSON language support for Forge: parse-error diagnostics and value/key completion."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "json"
file_extensions = ["json", "jsonc"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-json"
args = []