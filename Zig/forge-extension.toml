id = "zig"
name = "Zig"
description = "Zig language support for Forge: zls, preferring an install already on PATH, otherwise downloading a pinned release automatically. Requires a Zig toolchain on PATH for full features."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "zig"
file_extensions = ["zig"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-zig"
args = []
