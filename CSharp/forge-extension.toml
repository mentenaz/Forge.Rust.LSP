id = "csharp"
name = "C#"
description = "C# language support for Forge: Microsoft's official Roslyn LSP (auto-installed via the dotnet tool), with Razor cohosting when the VS Code C# extension is present."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "csharp"
file_extensions = ["cs", "csx", "cshtml", "razor"]

[language_server]
# Base binary name (no extension); the release pipeline appends the platform
# suffix (`.exe` on Windows) when producing the artifact.
binary = "forge-lsp-csharp"
args = []
