id = "yaml"
name = "YAML"
description = "YAML language support for Forge: yaml-language-server, preferring an install already on PATH, otherwise installing a pinned npm package automatically (requires Node.js)."
version = "0.1.0"
schema_version = 1
authors = ["Mentenaz"]

[language]
language_id = "yaml"
file_extensions = ["yaml", "yml"]

[language_server]
binary = "forge-lsp-yaml"
args = []
